<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="DramaVideo 六站点支付管理交互原型：PSP 多账户、站点支付配置、商品 SKU 与推广链接。所有操作均为演示。">
  <title>DramaVideo Backend · 支付与推广管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#payment" data-page="payment" aria-label="DramaVideo 后台首页"><span class="brand-mark" aria-hidden="true">D</span><span class="brand-divider"></span><span>DramaVideo Backend</span></a>
    <nav class="topnav" aria-label="后台中心">
      <button type="button" data-page="links">首页</button>
      <button type="button" data-page="products">业务中心</button>
      <button type="button" class="selected" data-page="links">投放中心</button>
    </nav>
    <div class="top-tools">
      <span class="avatar" aria-label="演示管理员">D</span>
    </div>
  </header>
  <aside class="sidebar">
    <nav aria-label="投放中心菜单">
      <div class="nav-static"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14v11H3zM6 2v5M14 2v5M3 9h14"/></svg></span>投放广告管理</div>
      <button type="button" class="nav-item" data-page="links"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 3 16 6-7 3-3 6-6-15Z M18 9l-8 2"/></svg></span>推广链接管理</button>
      <button type="button" class="nav-item" data-page="payment"><span class="nav-icon icon-card"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M2 8h16M5 12h4"/></svg></span>支付管理</button>
      <button type="button" class="nav-item" data-page="templates"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2" width="14" height="16" rx="2"/><path d="M6 6h8M6 10h8M6 14h5"/></svg></span>充值模板管理</button>
      <button type="button" class="nav-item" data-page="products"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14v11H3zM6 2v5M14 2v5M3 9h14"/></svg></span>商品 SKU 管理</button>
      <div class="nav-separator"></div>
      <div class="nav-static secondary"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17V3M3 17h14M6 14V9M10 14V5M14 14V7"/></svg></span>投放数据统计</div>
      <div class="nav-static secondary"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="m8 7 5 3-5 3z"/></svg></span>剧目数据统计</div>
      <div class="nav-static secondary"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17V3M3 17h14M5 13l4-5 4 3 4-7"/></svg></span>ROI数据统计</div>
      <div class="nav-static secondary"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="6" r="3"/><path d="M4 17v-2a6 6 0 0 1 12 0v2"/></svg></span>用户数据统计</div>
    </nav>
    <div class="sidebar-foot"><span class="demo-dot"></span>交互原型 · 未接入实际支付</div>
  </aside>
  <main id="view" class="main-content" aria-label="后台内容"></main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="model.js"></script>
  <script src="page-scopes.js"></script>
  <script src="app.js"></script>
</body>
</html>
